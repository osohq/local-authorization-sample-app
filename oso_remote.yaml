facts:
  has_relation(Team:_, parent_team, Team:_):
    db: app-db
    query: |-
      SELECT team_id, parent_team_id
      FROM demo_app.teams
      WHERE parent_team_id IS NOT NULL
  has_relation(Team:_, managed_by, User:_):
    db: app-db
    query: |-
      SELECT team_id, user_id
      FROM demo_app.users
      WHERE is_team_manager = TRUE
  has_role(User:_, Admin, Company:_):
    db: app-db
    query: |-
      SELECT user_id, company_id FROM demo_app.users WHERE is_company_admin = TRUE
  has_role(User:_, Head, Department:_):
    db: app-db
    query: |-
      SELECT user_id, department_id FROM demo_app.users WHERE is_department_head = TRUE
  has_relation(Card:_, owner, User:_):
    db: app-db
    query: |-
      SELECT card_id, owner_id FROM demo_app.cards
  has_relation(User:_, team, Team:_):
    db: app-db
    query: |-
      SELECT user_id, team_id FROM demo_app.users WHERE team_id IS NOT NULL
  has_relation(User:_, company, Company:_):
    db: app-db
    query: |-
      SELECT user_id, company_id FROM demo_app.users
  has_relation(User:_, department, Department:_):
    db: app-db
    query: |-
      SELECT user_id, department_id FROM demo_app.users WHERE department_id IS NOT NULL
dbs:
  app-db:
    connection_string: $DATABASE_URL
